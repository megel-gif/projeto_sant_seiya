    <h2 align="center"><font color="#ffd700">Fale Conosco</font></h2>

    <p align="center">
        Envie sua mensagem, dúvida ou sugestão para a nossa equipe do Santuário!
    </p>

    <!-- Formulário de Contato Estruturado em Tabela -->
    <form action="#" method="post">
        <table border="1" width="60%" align="center" cellpadding="8" bordercolor="#ffd700" bgcolor="#161f36">
            <tr>
                <td width="30%" align="right">
                    <label for="nome"><strong>Nome Completo:</strong></label>
                </td>
                <td>
                    <input type="text" id="nome" name="nome" size="40" placeholder="Digite seu nome" required />
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="email"><strong>E-mail:</strong></label>
                </td>
                <td>
                    <input type="email" id="email" name="email" size="40" placeholder="seuemail@exemplo.com" required />
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="signo"><strong>Seu Signo:</strong></label>
                </td>
                <td>
                    <select id="signo" name="signo">
                        <option value="">-- Selecione seu Signo --</option>
                        <option value="aries">Áries</option>
                        <option value="touro">Touro</option>
                        <option value="gemeos">Gêmeos</option>
                        <option value="cancer">Câncer</option>
                        <option value="leao">Leão</option>
                        <option value="virgem">Virgem</option>
                        <option value="libra">Libra</option>
                        <option value="escorpiao">Escorpião</option>
                        <option value="sagitario">Sagitário</option>
                        <option value="capricornio">Capricórnio</option>
                        <option value="aquario">Aquário</option>
                        <option value="peixes">Peixes</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td align="right">
                    <label for="favorito"><strong>Cavaleiro Favorito:</strong></label>
                </td>
                <td>
                    <select id="favorito" name="favorito">
                        <option value="">-- Selecione um Cavaleiro --</option>
                        <option value="seiya">Seiya de Pégaso</option>
                        <option value="shiryu">Shiryu de Dragão</option>
                        <option value="hyoga">Hyoga de Cisne</option>
                        <option value="shun">Shun de Andrômeda</option>
                        <option value="ikki">Ikki de Fênix</option>
                        <option value="outro">Outro (Cavaleiro de Ouro/Prata)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td align="right" valign="top">
                    <label for="mensagem"><strong>Mensagem:</strong></label>
                </td>
                <td>
                    <textarea id="mensagem" name="mensagem" rows="6" cols="42" placeholder="Escreva sua mensagem aqui..." required></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Enviar Mensagem" />
                    &nbsp;&nbsp;
                    <input type="reset" value="Limpar Campos" />
                </td>
            </tr>
        </table>
    </form>
